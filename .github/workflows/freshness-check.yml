name: Freshness Check

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check upstream releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Check GitHub API rate limit
        run: |
          remaining=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/rate_limit | jq '.rate.remaining')
          echo "GitHub API remaining: $remaining"
          (( remaining >= 20 )) || { echo "Rate limit too low"; exit 1; }

      - name: Fetch latest tags from tools.tsv
        run: |
          set -euo pipefail
          latest() {
            curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$1/releases/latest" \
              | jq -r '.tag_name // "unknown"'
          }

          awk -F '\t' 'NF == 7 && $5 != "" && $5 != "repo" { print $1 "\t" $5 }' manifests/tools.tsv |
          while IFS=$'\t' read -r name repo; do
            printf "%-12s %s\n" "$name" "$(latest "$repo")"
          done | tee /tmp/upstream-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-report-${{ github.run_id }}
          path: /tmp/upstream-report.txt
          retention-days: 30
