name: Safe-Clean-Uninstall

on:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - uninstall.sh
      - uninstall.ps1
      - tests/uninstall/**
      - manifests/**
      - config/**
      - docs/uninstall.md
      - .github/workflows/uninstall-validation.yml
  workflow_dispatch:

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit contract
        run: bash tests/uninstall/safe-clean.sh
      - name: Real scripts twice in isolated HOME
        env:
          SKIP_PACKAGES: '1'
          SKIP_CLAUDE_CODE: '1'
          SKIP_SKILLS: '1'
          SKIP_PLUGINS: '1'
        run: |
          export HOME="$RUNNER_TEMP/dotfiles-home"
          export DOTFILES_RECEIPT_PATH="$HOME/.local/state/dotfiles/install-receipt.json"
          export GIT_CONFIG_GLOBAL="$HOME/.gitconfig"
          mkdir -p "$HOME"
          printf 'user-sentinel\n' > "$HOME/user.txt"
          printf '# user profile sentinel\n' > "$HOME/.bashrc"
          mkdir -p "$HOME/.codex/hooks"
          printf '[user]\nkeep = true\n' > "$HOME/.codex/config.toml"
          printf 'user-hook\n' > "$HOME/.codex/hooks/user.sh"
          git_before="$(git --version)"
          bash install.sh
          bash install.sh
          bash uninstall.sh --keep-packages
          bash uninstall.sh --keep-packages
          grep -Fxq user-sentinel "$HOME/user.txt"
          grep -Fq '# user profile sentinel' "$HOME/.bashrc"
          grep -Fq 'keep = true' "$HOME/.codex/config.toml"
          grep -Fxq user-hook "$HOME/.codex/hooks/user.sh"
          test "$(git --version)" = "$git_before"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/uninstall/safe-clean.ps1
      - name: Real scripts twice in isolated profile
        shell: pwsh
        env:
          SKIP_PACKAGES: '1'
          SKIP_CLAUDE_CODE: '1'
          SKIP_SKILLS: '1'
          SKIP_PLUGINS: '1'
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'dotfiles-home'
          $env:HOME = $env:USERPROFILE
          $env:APPDATA = Join-Path $env:USERPROFILE 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE 'AppData\Local'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:USERPROFILE '.gitconfig'
          $env:DOTFILES_RECEIPT_PATH = Join-Path $env:LOCALAPPDATA 'dotfiles\install-receipt.json'
          $env:DOTFILES_PS_PROFILE_PATH = Join-Path $env:USERPROFILE 'profile.ps1'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          Set-Content (Join-Path $env:USERPROFILE 'user.txt') 'user-sentinel'
          Set-Content $env:DOTFILES_PS_PROFILE_PATH '# user profile sentinel'
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.codex\hooks') | Out-Null
          Set-Content (Join-Path $env:USERPROFILE '.codex\config.toml') "[user]`nkeep = true"
          Set-Content (Join-Path $env:USERPROFILE '.codex\hooks\user.ps1') 'user-hook'
          $yaziBefore = [Environment]::GetEnvironmentVariable('YAZI_FILE_ONE','User')
          $pathBefore = [Environment]::GetEnvironmentVariable('PATH','User')
          $gitBefore = git --version
          & ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "first install failed: $LASTEXITCODE" }
          & ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "second install failed: $LASTEXITCODE" }
          if ([Environment]::GetEnvironmentVariable('YAZI_FILE_ONE','User') -cne $yaziBefore) { throw 'config install changed YAZI_FILE_ONE' }
          if ([Environment]::GetEnvironmentVariable('PATH','User') -cne $pathBefore) { throw 'config install changed User PATH' }
          & ./uninstall.ps1 -KeepPackages
          if ($LASTEXITCODE -ne 0) { throw "first uninstall failed: $LASTEXITCODE" }
          & ./uninstall.ps1 -KeepPackages
          if ($LASTEXITCODE -ne 0) { throw "second uninstall failed: $LASTEXITCODE" }
          if ((Get-Content (Join-Path $env:USERPROFILE 'user.txt')) -ne 'user-sentinel') { throw 'user sentinel changed' }
          if (-not (Get-Content $env:DOTFILES_PS_PROFILE_PATH -Raw).Contains('# user profile sentinel')) { throw 'profile sentinel changed' }
          if (-not (Get-Content (Join-Path $env:USERPROFILE '.codex\config.toml') -Raw).Contains('keep = true')) { throw 'config sentinel changed' }
          if ((Get-Content (Join-Path $env:USERPROFILE '.codex\hooks\user.ps1')) -ne 'user-hook') { throw 'hook sentinel changed' }
          if ([Environment]::GetEnvironmentVariable('YAZI_FILE_ONE','User') -ne $yaziBefore) { throw 'environment value not restored' }
          $pathAfter = [Environment]::GetEnvironmentVariable('PATH','User')
          if ($pathAfter -cne $pathBefore) { throw 'User PATH not restored exactly' }
          if ((git --version) -ne $gitBefore) { throw 'pre-existing package sentinel changed' }
