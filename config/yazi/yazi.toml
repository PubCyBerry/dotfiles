[opener]
edit = [
    { run = 'nvim "%s"', block = true, for = "windows" },
    { run = 'nvim "%s"', block = true, for = "unix" },
]

[open]
prepend_rules = [
    { mime = "text/*",            use = "edit" },
    { mime = "application/json",  use = "edit" },
    { mime = "application/toml",  use = "edit" },
    { mime = "application/xml",   use = "edit" },
    { url = "*.md",   use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.json", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml",  use = "edit" },
    { url = "*.sh",   use = "edit" },
    { url = "*.ps1",  use = "edit" },
    { url = "*.lua",  use = "edit" },
]
